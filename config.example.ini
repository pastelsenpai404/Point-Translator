# Copy this file to config.ini beside ThaiKaraokeOverlay.exe.
# The server must provide an OpenAI-compatible /v1/chat/completions endpoint.
api_base=https://api.openai.com
model=gpt-4.1-mini

# Recommended: keep the key out of this file and set it for your account:
#   setx THAI_OVERLAY_API_KEY "your-key"
# You may instead uncomment the next line (less secure).
# api_key=your-key

# Global shortcuts use Ctrl+Alt plus the key below.
translate_hotkey=T
ocr_hotkey=O
quit_hotkey=Q

# Use every installed Windows OCR language and let the local AI select the best
# result. You may enter a language tag such as zh-Hans-CN to force one language.
ocr_language=auto

# Overlay content and appearance.
show_original=true
show_karaoke=true
show_explanation=true
show_word_breakdown=true
overlay_opacity=96
overlay_position=bottom
auto_hide_seconds=0
